<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glo Beauty | Admin</title>
    <style>
      :root {
        --bg: #090909;
        --panel: #111111;
        --line: rgba(217, 179, 95, 0.4);
        --gold: #d9b35f;
        --gold-strong: #c9962d;
        --text: #f5efe5;
        --muted: #d3c7b2;
        --danger: #ff7d7d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #090909, #120d07);
        color: var(--text);
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      h1 {
        font-family: Georgia, serif;
        color: var(--gold);
        margin-bottom: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
      }
      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat strong {
        font-size: 2rem;
        color: var(--gold);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }
      th, td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(217, 179, 95, 0.2);
        color: var(--text);
      }
      th {
        background: rgba(217, 179, 95, 0.08);
        color: var(--gold);
      }
      .badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(217, 179, 95, 0.12);
        border: 1px solid var(--line);
        color: var(--gold);
        font-size: 0.75rem;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, var(--gold), var(--gold-strong));
        color: #120d07;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
      }
      @media (max-width: 720px) {
        .stats { grid-template-columns: 1fr; }
        .header-row { flex-direction: column; align-items: flex-start; }
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-row">
        <h1>Administration Glo Beauty</h1>
        <a class="btn" href="/">Retour au site</a>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Commandes</span>
          <strong id="totalOrders">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Revenu</span>
          <strong id="totalRevenue">0 $</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Dernière commande</span>
          <strong id="lastOrder">-</strong>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Client</th>
            <th>Ville</th>
            <th>Mode</th>
            <th>Paiement</th>
            <th>Total</th>
            <th>Créée</th>
          </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>

    <script>
      async function loadOrders() {
        const res = await fetch('/api/admin/orders');
        const data = await res.json();

        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = '';

        document.getElementById('totalOrders').textContent = data.totalOrders || 0;
        document.getElementById('totalRevenue').textContent = `${Number(data.totalRevenue || 0).toFixed(2)} $`;
        document.getElementById('lastOrder').textContent = data.orders?.[0]?.createdAt ? new Date(data.orders[0].createdAt).toLocaleDateString() : '-';

        if (!data.orders || !data.orders.length) {
          tbody.innerHTML = '<tr><td colspan="7">Aucune commande pour le moment.</td></tr>';
          return;
        }

        data.orders.forEach((order) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>#${order.id}</td>
            <td>
              <strong>${order.customerName}</strong><br>
              <small>${order.customerEmail}</small>
            </td>
            <td>${order.deliveryCity}</td>
            <td><span class="badge">${order.deliveryMode}</span></td>
            <td>${order.paymentMethod}</td>
            <td>${Number(order.total).toFixed(2)} $</td>
            <td>${new Date(order.createdAt).toLocaleString()}</td>
          `;
          tbody.appendChild(row);
        });
      }

      loadOrders();
      setInterval(loadOrders, 5000);
    </script>
  </body>
</html>
